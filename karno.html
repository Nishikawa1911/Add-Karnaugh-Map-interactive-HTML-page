<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карно картасы</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#d5d9e3;--b:#1e6bff;--r:#e5304a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mu:#9aa1b2;--bd:#343a4a;--b:#5b9bff;--r:#ff6b7f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:14px}
main{max-width:560px;margin:auto}h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.seg button.on{background:var(--b);color:#fff;border-color:var(--b)}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:18px monospace;letter-spacing:3px}
small{color:var(--mu)}
table{border-collapse:collapse;margin:8px auto}td,th{width:64px;height:56px;text-align:center;padding:0;position:relative}
th{width:auto;height:auto;font-size:13px;color:var(--mu);padding:2px 6px;font-weight:600}
td.c{border:1px solid var(--bd);font-size:22px;font-weight:700;cursor:pointer;user-select:none}
td.c i{position:absolute;left:3px;top:1px;font-size:9px;color:var(--mu);font-style:normal;font-weight:400}
td.c span{position:relative;z-index:2}
.g{position:absolute;pointer-events:none;border:0 solid;border-radius:0}
.res{font-size:17px;line-height:1.7;word-break:break-word}.res b{color:var(--b)}.res b.z{color:var(--r)}
.nb{text-decoration:overline}
h2{font-size:15px;margin:0 0 6px;color:var(--mu)}
svg{width:100%;height:auto}svg text{fill:var(--tx);font:13px sans-serif}
.sc{overflow-x:auto}
.tt{border-collapse:collapse;margin:auto}
.tt td,.tt th{width:auto;height:auto;padding:4px 14px;border:1px solid var(--bd);font:15px monospace;color:var(--tx)}
.tt td.f{cursor:pointer;font-weight:700}
.tt tr.o td.f{color:var(--b)}
</style></head><body><main>
<h1>Карно картасы</h1>
<div class="card">
<div class="seg"><button id="b3">3 элемент (2³)</button><button id="b4" class="on">4 элемент (2⁴)</button></div>
<small>F мәндерін ретімен жазыңыз (<span id="ord"></span>) немесе кестеде ұяны басыңыз:</small>
<input id="inp" inputmode="numeric" placeholder="11110000" autocomplete="off">
<div style="text-align:center;overflow-x:auto" id="map"></div>
<small>🔵 көк — 1-дер (ДНФ) · 🔴 қызыл — 0-дер (КНФ). Топтар 1, 2, 4, 8 болып, шеттері бір-бірімен жалғасады.</small>
</div>
<div class="card"><h2>Ақиқат кестесі (F мәнін басып өзгертуге болады)</h2>
<div style="overflow-x:auto"><div id="tt"></div></div></div>

<div class="card res"><h2>ДНФ (1-дер бойынша)</h2><div id="dnf"></div><h2 style="margin-top:10px">КНФ (0-дер бойынша)</h2><div id="knf"></div></div>
<div class="card"><h2>ДНФ схемасы</h2><div class="sc" id="s1"></div></div>
<div class="card"><h2>КНФ схемасы</h2><div class="sc" id="s2"></div></div>
</main>
<script>
const V=['A','B','C','D'],G=[0,1,3,2];let n=4,vals=[],N=16;
const R=()=>1<<(n-2),rg=r=>n==3?r:G[r],ix=(r,c)=>(rg(r)<<2)|G[c];
const bin=(x,k)=>x.toString(2).padStart(k,'0');
function reset(){N=1<<n;vals=Array(N).fill(0);vals.forEach((_,i)=>vals[i]=i<N/2?1:0);
 document.getElementById('ord').textContent=V.slice(0,n).join('')+' = '+bin(0,n)+' … '+bin(N-1,n);
 document.getElementById('inp').maxLength=N+4;render()}
function valid(m,v,t){for(let x=0;x<N;x++)if((x&m)==v&&vals[x]!=t)return false;return true}
function cover(t){
 const pr=[];
 for(let m=0;m<N;m++){let v=m;for(;;){
  if(valid(m,v,t)){let ok=true;for(let b=1;b<N;b<<=1)if(m&b&&valid(m&~b,v&~b,t)){ok=false;break}
   if(ok)pr.push({m,v})}
  if(!v)break;v=(v-1)&m}}
 const cv=c=>{const a=[];for(let x=0;x<N;x++)if((x&c.m)==c.v&&vals[x]==t)a.push(x);return a};
 const mins=[];vals.forEach((q,i)=>{if(q==t)mins.push(i)});
 const sel=[],done=new Set(),take=c=>{if(!sel.includes(c)){sel.push(c);cv(c).forEach(x=>done.add(x))}};
 mins.forEach(x=>{const f=pr.filter(c=>(x&c.m)==c.v);if(f.length==1)take(f[0])});
 while(mins.some(x=>!done.has(x))){let best=null,bs=-1;
  pr.forEach(c=>{const s=cv(c).filter(x=>!done.has(x)).length;if(s>bs){bs=s;best=c}});take(best)}
 return sel.map(c=>({...c,cells:cv(c)}));
}
const lits=(c,t)=>{const a=[];for(let j=0;j<n;j++){const b=1<<(n-1-j);if(c.m&b){const one=!!(c.v&b);a.push({n:V[j],neg:t?!one:one})}}return a};
const L=l=>l.neg?`<span class="nb">${l.n}</span>`:l.n;
function expr(cs,t){
 if(!cs.length)return t?'0':'1';
 if(cs.some(c=>!c.m))return t?'1':'0';
 const parts=cs.map(c=>{const l=lits(c,t).map(L);return t?l.join('·'):(cs.length>1&&l.length>1?'('+l.join(' + ')+')':l.join(' + '))});
 return parts.join(t?' + ':'·');
}
function scheme(cs,t){
 if(!cs.length||cs.some(c=>!c.m))return '<small>Схема қажет емес: F = '+(cs.length?(t?1:0):(t?0:1))+' (тұрақты)</small>';
 const T=cs.map(c=>lits(c,t)),g1=t?'&':'≥1',g2=t?'≥1':'&';
 let y=10,out='',ys=[];
 T.forEach(l=>{const h=Math.max(l.length*20,36),mid=y+h/2;
  l.forEach((q,i)=>{const yy=y+(h-(l.length-1)*20)/2+i*20-0;const py=l.length==1?mid:y+10+i*20+(h-l.length*20)/2;
   out+=`<text x="4" y="${py+4}">${q.neg?'¬':''}${q.n}</text><line x1="34" y1="${py}" x2="80" y2="${py}" stroke="currentColor" opacity=".6"/>`});
  if(l.length>1)out+=`<rect x="80" y="${y+2}" width="40" height="${h-4}" rx="4" fill="none" stroke="currentColor"/><text x="100" y="${mid+4}" text-anchor="middle">${g1}</text>`;
  else out+=`<line x1="80" y1="${mid}" x2="120" y2="${mid}" stroke="currentColor" opacity=".6"/>`;
  ys.push(mid);y+=h+8});
 const H=y+2;
 if(T.length>1){const mid=(ys[0]+ys[ys.length-1])/2,top=ys[0]-12,hh=ys[ys.length-1]-ys[0]+24;
  ys.forEach(q=>out+=`<line x1="120" y1="${q}" x2="170" y2="${q}" stroke="currentColor" opacity=".6"/>`);
  out+=`<rect x="170" y="${top}" width="40" height="${hh}" rx="4" fill="none" stroke="currentColor"/><text x="190" y="${mid+4}" text-anchor="middle">${g2}</text><line x1="210" y1="${mid}" x2="250" y2="${mid}" stroke="currentColor"/><text x="256" y="${mid+4}">F</text>`}
 else out+=`<line x1="120" y1="${ys[0]}" x2="250" y2="${ys[0]}" stroke="currentColor"/><text x="256" y="${ys[0]+4}">F</text>`;
 return `<svg viewBox="0 0 280 ${H}" style="color:var(--tx)">${out}</svg>`;
}
function scheme2(cs,t){
 if(!cs.length||cs.some(c=>!c.m))return scheme(cs,t);
 const T=cs.map(c=>lits(c,t)),g1=t?'&':'≥1',g2=t?'≥1':'&',S='stroke="currentColor" fill="none"';
 const used=[],neg={};
 T.forEach(l=>l.forEach(q=>{if(!used.includes(q.n))used.push(q.n);if(q.neg)neg[q.n]=1}));
 used.sort();
 const bx={},nx={};let x=24;
 used.forEach(v=>{bx[v]=x;if(neg[v])nx[v]=x+24;x+=neg[v]?54:32});
 const gx=x+14;let out='',y=84,ys=[];
 T.forEach(l=>{const h=Math.max(l.length*16+8,26),mid=y+h/2,top=mid-(l.length-1)*8;
  l.forEach((q,i)=>{const py=top+i*16,px=q.neg?nx[q.n]:bx[q.n];
   out+=`<line x1="${px}" y1="${py}" x2="${l.length>1?gx:gx+40}" y2="${py}" ${S}/><circle cx="${px}" cy="${py}" r="2.6" fill="currentColor"/>`});
  if(l.length>1)out+=`<rect x="${gx}" y="${y}" width="40" height="${h}" rx="4" ${S}/><text x="${gx+20}" y="${mid+4}" text-anchor="middle">${g1}</text>`;
  ys.push(mid);y+=h+10});
 const H=y;
 used.forEach(v=>{out+=`<text x="${bx[v]}" y="14" text-anchor="middle" font-weight="700">${v}</text><line x1="${bx[v]}" y1="20" x2="${bx[v]}" y2="${H}" ${S}/>`;
  if(neg[v]){const a=nx[v];out+=`<circle cx="${bx[v]}" cy="50" r="2.6" fill="currentColor"/><line x1="${bx[v]}" y1="50" x2="${a-9}" y2="50" ${S}/><rect x="${a-9}" y="40" width="18" height="20" rx="3" ${S}/><text x="${a}" y="54" text-anchor="middle" font-size="11">1</text><circle cx="${a}" cy="64" r="3.5" ${S}/><line x1="${a}" y1="67.5" x2="${a}" y2="${H}" ${S}/><text x="${a}" y="32" text-anchor="middle" font-size="11">¬${v}</text>`}});
 const ox=gx+90;let W;
 if(T.length>1){const mid=(ys[0]+ys[ys.length-1])/2;
  ys.forEach(q=>out+=`<line x1="${gx+40}" y1="${q}" x2="${ox}" y2="${q}" ${S}/>`);
  out+=`<rect x="${ox}" y="${ys[0]-14}" width="40" height="${ys[ys.length-1]-ys[0]+28}" rx="4" ${S}/><text x="${ox+20}" y="${mid+4}" text-anchor="middle">${g2}</text><line x1="${ox+40}" y1="${mid}" x2="${ox+80}" y2="${mid}" ${S}/><text x="${ox+86}" y="${mid+4}">F</text>`}
 else out+=`<line x1="${gx+40}" y1="${ys[0]}" x2="${ox+40}" y2="${ys[0]}" ${S}/><text x="${ox+46}" y="${ys[0]+4}">F</text>`;
 W=ox+110;
 return `<svg viewBox="0 0 ${W} ${H+4}" style="color:var(--tx)">${out}</svg>`;
}
function render(){
 const one=cover(1),zero=cover(0),rows=R();
 const gs=[...one.map((c,i)=>({c,col:'var(--b)',k:i})),...zero.map((c,i)=>({c,col:'var(--r)',k:i}))];
 const pos={};for(let r=0;r<rows;r++)for(let c=0;c<4;c++)pos[ix(r,c)]=[r,c];
 const rl=n==3?'A':'AB',cl=n==3?'BC':'CD';
 let h=`<table><tr><th>${rl}＼${cl}</th>${G.map(x=>`<th>${bin(x,2)}</th>`).join('')}</tr>`;
 for(let r=0;r<rows;r++){h+=`<tr><th>${bin(rg(r),n-2)}</th>`;
  for(let c=0;c<4;c++){const i=ix(r,c);let ov='';
   gs.forEach(({c:g,col,k})=>{if(!g.cells.includes(i))return;
    const has=(dr,dc)=>g.cells.includes(ix((r+dr+rows)%rows,(c+dc+4)%4));
    const o=3+(col.includes('--r')?k%3*4+2:k%3*4),B='2.5px';
    const e=(f,s)=>f?'0':B;
    ov+=`<div class="g" style="inset:${o}px;border-color:${col};border-top-width:${e(has(-1,0),0)};border-bottom-width:${e(has(1,0),0)};border-left-width:${e(has(0,-1),0)};border-right-width:${e(has(0,1),0)};background:color-mix(in srgb,${col} 12%,transparent)"></div>`});
   h+=`<td class="c" data-i="${i}"><i>${i}</i>${ov}<span>${vals[i]}</span></td>`}
  h+='</tr>'}
 map.innerHTML=h+'</table>';
 map.querySelectorAll('td.c').forEach(td=>td.onclick=()=>{const i=+td.dataset.i;vals[i]^=1;render()});
 if(document.activeElement!==inp)inp.value=vals.join('');
 dnf.innerHTML='F = <b>'+expr(one,1)+'</b>';knf.innerHTML='F = <b class="z">'+expr(zero,0)+'</b>';
 s1.innerHTML=scheme2(one,1);s2.innerHTML=scheme2(zero,0);
 let t=`<table class="tt"><tr><th>№</th>${V.slice(0,n).map(v=>`<th>${v}</th>`).join('')}<th>F</th></tr>`;
 for(let i=0;i<N;i++){t+=`<tr class="${vals[i]?'o':''}"><td>${i}</td>${bin(i,n).split('').map(b=>`<td>${b}</td>`).join('')}<td class="f" data-i="${i}">${vals[i]}</td></tr>`}
 $('tt').innerHTML=t+'</table>';
 $('tt').querySelectorAll('td.f').forEach(td=>td.onclick=()=>{vals[+td.dataset.i]^=1;render()});
}
const $=id=>document.getElementById(id),map=$('map'),inp=$('inp'),dnf=$('dnf'),knf=$('knf'),s1=$('s1'),s2=$('s2');
inp.oninput=()=>{const s=inp.value.replace(/[^01]/g,'');
 if(s.length==N){vals=s.split('').map(Number);render()}};
inp.onblur=()=>inp.value=vals.join('');
$('b3').onclick=()=>{n=3;$('b3').classList.add('on');$('b4').classList.remove('on');reset()};
$('b4').onclick=()=>{n=4;$('b4').classList.add('on');$('b3').classList.remove('on');reset()};
reset();
</script></body></html>
